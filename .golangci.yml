# Starter golangci-lint configuration with a moderate default set.
# Strict linters are listed commented out below; enable them per project.
version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errname
    - errorlint
    - gocritic
    - misspell
    - noctx
    - nolintlint
    - revive
    - unconvert
    - unparam
    - usestdlibvars

  exclusions:
    rules:
      - linters: [all]
        path: ".*\\.pb\\.go$"
      - linters: [all]
        path: ".*_generated\\.go$"

  settings:
    misspell:
      locale: US
    nolintlint:
      require-specific: true
    revive:
      confidence: 0.8
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming
    # Deliberate: CLI and MCP output writes to stdout/stderr and environment
    # helpers ignore their errors. Keep these exclusions when refreshing the
    # scaffold config; see GOLANG.md.
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintln
        - fmt.Fprintf
        - os.Setenv
        - os.Unsetenv
        - (*encoding/json.Encoder).Encode

  # Strict linters kept off by default:
  # - exhaustruct: requires exhaustive struct literals.
  # - varnamelen: enforces variable-name length thresholds.
  # - funlen: limits function length.
  # - gocognit: limits cognitive complexity.
  # - paralleltest: requires parallel test conventions.
  # - dupl: flags duplicated code aggressively.
  # - gocyclo: limits cyclomatic complexity.
  # - lll: limits source-line length.
  # - nakedret: limits named-return usage.
  # - prealloc: suggests allocation changes.
  # - testpackage: requires external test packages.
  # - tparallel: requires `t.Parallel` conventions.

formatters:
  enable:
    - gofmt
    - goimports
