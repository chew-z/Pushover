# =============================================================================
# pushover — additions to /etc/nginx/sites-available/karma.rrj.pl.conf
#
# Paste these THREE location blocks inside the
# `server { listen 443 ssl; server_name karma.rrj.pl; }` block, next to the
# alerts blocks. Then REMOVE pushover from the shared alternation, so it reads
# `location ~ ^/(?:answer|gemini|time)/(.*)$`, and from `map $uri $mcp_backend`
# if it is listed there: that block denies GET, and /authorize is a GET
# reached by a browser redirect.
#
# Upstream: pushover on 127.0.0.1:8080 (PUSHOVER_HTTP_ADDRESS default).
# Issuer   https://karma.rrj.pl/pushover
# Resource https://karma.rrj.pl/pushover/mcp
#
# These blocks do not include snippets/mcp.conf on purpose. That snippet sets
# X-Forwarded-For with $proxy_add_x_forwarded_for (append), which keeps a
# client-forged first entry; here the header is overwritten with $remote_addr.
# Everything else the snippet provides is spelled out here.
# =============================================================================

# --- 1. RFC 9728 protected-resource metadata -------------------------------
# Probe path = well-known prefix + resource path. Pushover registers this
# literal path (internal/oauth/mount.go); pass it through unchanged.
location = /.well-known/oauth-protected-resource/pushover/mcp {
    proxy_pass http://127.0.0.1:8080/.well-known/oauth-protected-resource/pushover/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- 2. RFC 8414 authorization-server metadata -----------------------------
# Path-inserted because the issuer has a path component (/pushover).
location = /.well-known/oauth-authorization-server/pushover {
    proxy_pass http://127.0.0.1:8080/.well-known/oauth-authorization-server/pushover;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- 3. The service itself --------------------------------------------------
# The trailing slash on proxy_pass strips /pushover/, so Pushover sees
# /mcp, /authorize, /login, /token, /register, /health and /capabilities.
location ^~ /pushover/ {
    limit_except GET POST DELETE OPTIONS { deny all; }

    proxy_pass http://127.0.0.1:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;   # overwrite, never append
    proxy_set_header X-Forwarded-Proto $scheme;

    # Pushover caps MCP bodies at 4 MiB (maxMCPBodyBytes); reject larger here.
    client_max_body_size 4m;

    # Streamable HTTP: no buffering, long timeouts.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_connect_timeout 60s;
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;
}
